<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="30" y="30" width="1220" height="580" rx="16" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- Top bar -->
  <line x1="80" y1="85" x2="1200" y2="85" stroke="#374151" stroke-width="1"/>
  <text x="80" y="70" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9ca3af">GITHUB.COM / RAUFZEN / DEV-ARSENAL</text>
  <text x="1200" y="70" text-anchor="end" font-family="monospace" font-size="14" font-weight="600" fill="#38bdf8">CLI DEVELOPER TOOLKIT · v1.0</text>

  <!-- Title & Subtitle -->
  <g transform="translate(80, 160)">
    <text x="0" y="80" font-family="sans-serif" font-size="70" font-weight="900" fill="url(#title-grad)">DevArsenal</text>
    <text x="0" y="130" font-family="sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">The Zero-Dependency Swiss Army Knife CLI for Developers</text>

    <!-- Badges -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7dd3fc">🔐 CRYPTO &amp; HASH</text>

      <rect x="180" y="0" width="160" height="42" rx="8" fill="#1f2937" stroke="#818cf8" stroke-width="1"/>
      <text x="260" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#a5b4fc">🎫 JWT INSPECTOR</text>

      <rect x="360" y="0" width="160" height="42" rx="8" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
      <text x="440" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#6ee7b7">🌐 NETWORK PING</text>

      <rect x="540" y="0" width="160" height="42" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="1"/>
      <text x="620" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fde68a">⚡ ZERO DEPS</text>
    </g>

    <!-- CLI snippet -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="1120" height="60" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="25" y="37" font-family="monospace" font-size="16" fill="#38bdf8">$</text>
      <text x="45" y="37" font-family="monospace" font-size="15" fill="#e2e8f0">./devbox.py menu   # Interactive CLI &amp; TUI for Linux, Mac &amp; Termux</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="540" x2="1200" y2="540" stroke="#374151" stroke-width="1"/>
  <text x="80" y="570" font-family="sans-serif" font-size="15" font-weight="700" fill="#9ca3af">AUTHOR: <tspan fill="#ffffff">RAUF ZEN</tspan> (@raufzen)</text>
  <text x="1200" y="570" text-anchor="end" font-family="monospace" font-size="14" fill="#9ca3af">MIT LICENSE · 100% OPEN SOURCE</text>
</svg>
